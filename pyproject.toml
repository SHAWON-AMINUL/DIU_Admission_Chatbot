[project]
name = "diu-admission-rag"
version = "0.1.0"
description = "DIU Admission RAG - ingestion pipeline slice (AI/RAG owner)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres and/or the embedding service running; skipped when they are down",
]
